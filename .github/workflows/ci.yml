name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          # Node 22 runs the TypeScript unit tests natively (type stripping).
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Generates the model barrel the typecheck depends on.
      - run: pnpm models
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
        env:
          HF_API_BASE_URL: https://api.higgsfield.ai
